name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PROTEUS_REQUIRE_WASM_TESTS: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - name: Native libraries, fonts, and supported shells
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev fonts-dejavu-core fonts-noto-cjk fonts-noto-color-emoji fonts-firacode fontconfig zsh fish ncurses-bin
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests, including real WASM components
        run: cargo test --workspace --locked
      - name: Standalone SDK and file-manager tests
        run: |
          cargo test --manifest-path crates/proteus-plugin/Cargo.toml --locked
          cargo test --manifest-path plugins/files/Cargo.toml --locked
      - name: Build shipped and example components
        run: |
          cargo build --manifest-path plugins/files/Cargo.toml --locked --release --target wasm32-wasip2
          cargo build --manifest-path examples/plugins/pane-list/Cargo.toml --locked --release --target wasm32-wasip2
      - run: cargo build --workspace --release --locked
