[package]
name = "pane-list"
description = "Example Proteus plugin: a sidebar listing every pane"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
proteus-plugin = { path = "../../../crates/proteus-plugin" }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Not part of the terminal workspace: built for wasm32-wasip2.
[workspace]
