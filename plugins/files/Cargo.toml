[package]
name = "proteus-files"
description = "proteus.files: the first-party Proteus file manager plugin"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
imagesize = "=0.15.0"
md-5 = "=0.10.6"
proteus-plugin = { path = "../../crates/proteus-plugin" }
resvg = { version = "=0.48.1", default-features = false }
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Not part of the terminal workspace: built for wasm32-wasip2.
[workspace]
