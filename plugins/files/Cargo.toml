[package]
name = "proteus-files"
description = "proteus.files: the first-party Proteus file manager plugin"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
proteus-plugin = { path = "../../crates/proteus-plugin" }

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Not part of the terminal workspace: built for wasm32-wasip2.
[workspace]
