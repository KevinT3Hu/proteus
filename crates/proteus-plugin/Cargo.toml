[package]
name = "proteus-plugin"
description = "SDK for Proteus terminal plugins (wasm32-wasip2 components)"
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.98"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
proteus-i18n = { path = "../proteus-i18n" }
wit-bindgen = { version = "0.63.0", default-features = false, features = ["macros", "realloc", "std", "bitflags"] }
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Not part of the terminal workspace: built for wasm32-wasip2.
[workspace]
